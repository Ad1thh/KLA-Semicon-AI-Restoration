experiment_name: "nafnet_sr_kav_kla"
seed: 42

dataset:
  train_gt_dir: "./data/train/gt"
  train_degraded_dir: "./data/train/degraded"
  val_split: 0.2
  image_size: 256
  scale_factor: 2

model:
  in_channels: 1
  out_channels: 1
  width: 64
  enc_blk_nums: [2, 2, 4, 8]
  middle_blk_num: 12
  dec_blk_nums: [2, 2, 2, 2]

train:
  batch_size: 8
  gradient_accumulation_steps: 2
  epochs: 100
  learning_rate: 0.001
  min_lr: 0.000001
  amp_enabled: true
  checkpoint_dir: "./weights"
  best_weight_path: "./weights/nafnet_sr_best.pt"

loss_weights:
  charbonnier: 1.0
  ms_ssim: 0.5
  fft: 0.1
  lpips: 0.05